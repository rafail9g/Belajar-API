<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Katalog Buku — LibraryKuy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="index.html" class="nav-brand">
    <div class="nav-brand-icon">L</div>
    <span class="nav-brand-text">Library<span>Kuy</span></span>
  </a>
  <div class="nav-links" id="navLinks"></div>
  <div class="nav-user">
    <div class="nav-user-info">
      <div class="nav-user-name" id="navName">—</div>
      <div class="nav-user-role" id="navRole">—</div>
    </div>
    <div class="nav-avatar" id="navAvatar">?</div>
    <button class="btn btn-outline btn-sm" id="btnLogout">Keluar</button>
  </div>
</nav>

<div class="page-wrapper">
  <div class="page-header">
    <div>
      <div class="page-label">Perpustakaan</div>
      <h1 class="page-title">Katalog Buku</h1>
      <p class="page-subtitle">Temukan dan pinjam buku favoritmu</p>
    </div>
    <div id="adminActions" style="display:none;">
      <button class="btn btn-primary" id="btnAddBook">+ Tambah Buku</button>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="search-bar">
    <div class="search-input-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" class="form-control" placeholder="Cari judul atau penulis..." />
    </div>
    <select id="filterCategory" class="form-control" style="max-width:180px;">
      <option value="">Semua Kategori</option>
      <option value="fiksi">Fiksi</option>
      <option value="nonfiksi">Nonfiksi</option>
      <option value="sains">Sains</option>
      <option value="teknologi">Teknologi</option>
      <option value="sejarah">Sejarah</option>
      <option value="biografi">Biografi</option>
      <option value="agama">Agama</option>
      <option value="anak">Anak</option>
      <option value="komik">Komik</option>
      <option value="lainnya">Lainnya</option>
    </select>
  </div>

  <!-- BOOKS -->
  <div id="booksContainer">
    <div class="loading"><div class="spinner"></div>Memuat koleksi...</div>
  </div>
</div>

<!-- MOBILE NAV -->
<nav class="mobile-nav" id="mobileNav"></nav>

<!-- MODAL TAMBAH/EDIT BUKU -->
<div class="modal-overlay" id="bookModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Tambah Buku</span>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">Judul Buku *</label>
      <input type="text" id="fTitle" class="form-control" placeholder="Judul buku" />
    </div>
    <div class="form-group">
      <label class="form-label">Penulis *</label>
      <input type="text" id="fAuthor" class="form-control" placeholder="Nama penulis" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Kategori</label>
        <select id="fCategory" class="form-control">
          <option value="lainnya">Lainnya</option>
          <option value="fiksi">Fiksi</option>
          <option value="nonfiksi">Nonfiksi</option>
          <option value="sains">Sains</option>
          <option value="teknologi">Teknologi</option>
          <option value="sejarah">Sejarah</option>
          <option value="biografi">Biografi</option>
          <option value="agama">Agama</option>
          <option value="anak">Anak</option>
          <option value="komik">Komik</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Jumlah Eksemplar</label>
        <input type="number" id="fTotalCopies" class="form-control" placeholder="Jumlah" min="0" value="1" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">ISBN</label>
        <input type="text" id="fIsbn" class="form-control" placeholder="ISBN" />
      </div>
      <div class="form-group">
        <label class="form-label">Tahun Terbit</label>
        <input type="number" id="fPublishYear" class="form-control" placeholder="Tahun" />
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Penerbit</label>
        <input type="text" id="fPublisher" class="form-control" placeholder="Nama penerbit" />
      </div>
      <div class="form-group">
        <label class="form-label">Jumlah Halaman</label>
        <input type="number" id="fPages" class="form-control" placeholder="Halaman" />
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Lokasi Rak</label>
      <input type="text" id="fLocation" class="form-control" placeholder="Contoh: Rak A-01" />
    </div>
    <div class="form-group">
      <label class="form-label">Deskripsi</label>
      <textarea id="fDesc" class="form-control" placeholder="Deskripsi buku..." rows="3"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">URL Cover</label>
      <input type="text" id="fCoverImage" class="form-control" placeholder="https://..." />
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="modalCancel">Batal</button>
      <button class="btn btn-primary" id="modalSave">Simpan</button>
    </div>
  </div>
</div>

<!-- MODAL KONFIRMASI HAPUS -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal" style="max-width:380px;">
    <div class="modal-header">
      <span class="modal-title">Hapus Buku</span>
      <button class="modal-close" id="deleteClose">✕</button>
    </div>
    <p>Yakin ingin menghapus buku <strong id="deleteBookName"></strong>?</p>
    <div class="modal-footer">
      <button class="btn btn-outline" id="deleteCancelBtn">Batal</button>
      <button class="btn btn-danger" id="deleteConfirmBtn">Hapus</button>
    </div>
  </div>
</div>

<!-- MODAL PINJAM -->
<div class="modal-overlay" id="borrowModal">
  <div class="modal" style="max-width:400px;">
    <div class="modal-header">
      <span class="modal-title">Pinjam Buku</span>
      <button class="modal-close" id="borrowClose">✕</button>
    </div>
    <div style="margin-bottom:20px;">
      <p style="font-size:20px; font-weight:700;" id="borrowBookTitle">—</p>
      <p style="font-size:13px; color:var(--text2);" id="borrowBookAuthor">—</p>
    </div>
    <div style="background:var(--bg3); padding:14px; border-radius:var(--radius);">
      <p>📅 Masa peminjaman: <strong>14 hari</strong></p>
      <p>⚠️ Denda keterlambatan: <strong>Rp 1.000/hari</strong></p>
    </div>
    <div class="form-group" style="margin-top:16px;">
      <label class="form-label">Catatan (opsional)</label>
      <input type="text" id="borrowNotes" class="form-control" placeholder="Catatan untuk petugas..." />
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="borrowCancelBtn">Batal</button>
      <button class="btn btn-primary" id="borrowConfirmBtn">Pinjam Sekarang</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="../services/app.js"></script>
<script src="../services/authService.js"></script>
<script src="../services/productServices.js"></script>

<script>
// ==================== CEK LOGIN ====================
if (!App.isLoggedIn()) {
  App.redirect('login.html');
}

// ==================== DATA USER ====================
const user = App.getUser();
const isAdmin = App.isAdmin();

document.getElementById('navName').textContent = user?.name || 'User';
document.getElementById('navRole').textContent = isAdmin ? 'Admin' : 'Member';
document.getElementById('navAvatar').textContent = (user?.name || 'U')[0].toUpperCase();

// ==================== NAVIGASI ====================
const navLinks = document.getElementById('navLinks');
const mobileNav = document.getElementById('mobileNav');
const menuItems = [
  { href: 'index.html', label: 'Dashboard', icon: '⊟' },
  { href: 'add.product.html', label: 'Katalog', icon: '📚', active: true },
  { href: 'edit_product.html', label: 'Peminjaman', icon: '🔄' },
];

navLinks.innerHTML = menuItems.map(m => 
  `<a href="${m.href}" class="nav-link ${m.active ? 'active' : ''}">${m.label}</a>`
).join('');

mobileNav.innerHTML = `<div class="mobile-nav-links">${menuItems.map(m => 
  `<a href="${m.href}" class="mobile-nav-link ${m.active ? 'active' : ''}">${m.icon}<span>${m.label}</span></a>`
).join('')}</div>`;

document.getElementById('btnLogout').onclick = () => {
  App.clearAuth();
  App.redirect('login.html');
};

if (isAdmin) {
  document.getElementById('adminActions').style.display = 'flex';
}

// ==================== VARIABEL GLOBAL ====================
let allBooks = [];
let editingId = null;
let deletingId = null;
let borrowingId = null;

const bookIcons = ['📘', '📗', '📕', '📙', '📓', '📔'];
const randomIcon = (idx) => bookIcons[idx % bookIcons.length];

// Ambil stok yang tersedia dari field API
function getAvailableCopies(book) {
  // API fields: availableCopies, totalCopies
  return book.availableCopies ?? book.totalCopies ?? book.stock ?? 0;
}

// ==================== LOAD BUKU ====================
async function loadBooks() {
  try {
    const result = await BookService.getAll();
    
    let books = [];
    if (Array.isArray(result)) {
      books = result;
    } else if (result?.books && Array.isArray(result.books)) {
      books = result.books;
    } else if (result?.data && Array.isArray(result.data)) {
      books = result.data;
    }
    
    allBooks = books;
    renderBooks(allBooks);
  } catch (err) {
    console.error('❌ Load buku error:', err);
    document.getElementById('booksContainer').innerHTML = 
      `<div class="alert alert-error">Gagal memuat buku: ${err.message}</div>`;
  }
}

// ==================== RENDER BUKU ====================
function renderBooks(books) {
  const container = document.getElementById('booksContainer');
  
  if (!books || books.length === 0) {
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📚</div>
        <div class="empty-title">Tidak ada buku</div>
      </div>`;
    return;
  }
  
  container.innerHTML = `
    <div class="books-grid">
      ${books.map((book, idx) => {
        const bookId = book._id || book.id;
        const title = (book.title || 'Tanpa Judul').replace(/'/g, "\\'");
        const author = (book.author || '-').replace(/'/g, "\\'");
        // API field: availableCopies (stok yang bisa dipinjam)
        const available = getAvailableCopies(book);
        // API field: coverImage
        const cover = book.coverImage || book.cover || book.coverUrl;
        const category = book.category || '-';
        const rating = book.rating ? `⭐ ${book.rating}` : '';
        
        return `
          <div class="book-card">
            <div class="book-cover">
              ${cover ? 
                `<img src="${cover}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';this.parentElement.innerHTML='<span style=\\'font-size:52px;\\'>${randomIcon(idx)}</span>'">` :
                `<span style="font-size:52px;">${randomIcon(idx)}</span>`
              }
            </div>
            <div class="book-info">
              <div class="book-title">${book.title || 'Tanpa Judul'}</div>
              <div class="book-author">${book.author || '-'}</div>
              <div class="book-meta">
                <span style="font-size:11px; color:var(--text3);">${category}${rating ? ' · ' + rating : ''}</span>
                <span class="${available > 0 ? 'badge badge-green' : 'badge badge-red'}">
                  ${available > 0 ? `Tersedia: ${available}` : 'Habis'}
                </span>
              </div>
            </div>
            <div class="book-actions">
              ${isAdmin ? `
                <button class="btn btn-outline btn-sm" onclick='openEdit(${JSON.stringify(book)})'>Edit</button>
                <button class="btn btn-danger btn-sm" onclick="openDelete('${bookId}', '${title}')">Hapus</button>
              ` : `
                <button class="btn btn-primary btn-sm" ${available < 1 ? 'disabled' : ''} 
                  onclick="openBorrow('${bookId}', '${title}', '${author}')">
                  ${available > 0 ? 'Pinjam' : 'Habis'}
                </button>
              `}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

// ==================== FILTER ====================
function filterBooks() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const category = document.getElementById('filterCategory').value;
  
  const filtered = allBooks.filter(book => {
    const matchSearch = !search || 
      (book.title || '').toLowerCase().includes(search) ||
      (book.author || '').toLowerCase().includes(search) ||
      (book.isbn || '').toLowerCase().includes(search);
    const matchCategory = !category || book.category === category;
    return matchSearch && matchCategory;
  });
  
  renderBooks(filtered);
}

document.getElementById('searchInput').addEventListener('input', filterBooks);
document.getElementById('filterCategory').addEventListener('change', filterBooks);

// ==================== MODAL TAMBAH/EDIT ====================
function openAdd() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Tambah Buku';
  document.getElementById('fTitle').value = '';
  document.getElementById('fAuthor').value = '';
  document.getElementById('fCategory').value = 'lainnya';
  document.getElementById('fTotalCopies').value = '1';
  document.getElementById('fIsbn').value = '';
  document.getElementById('fPublishYear').value = '';
  document.getElementById('fPublisher').value = '';
  document.getElementById('fPages').value = '';
  document.getElementById('fLocation').value = '';
  document.getElementById('fDesc').value = '';
  document.getElementById('fCoverImage').value = '';
  document.getElementById('bookModal').classList.add('open');
}

function openEdit(book) {
  editingId = book._id || book.id;
  document.getElementById('modalTitle').textContent = 'Edit Buku';
  document.getElementById('fTitle').value = book.title || '';
  document.getElementById('fAuthor').value = book.author || '';
  document.getElementById('fCategory').value = book.category || 'lainnya';
  // API field: totalCopies
  document.getElementById('fTotalCopies').value = book.totalCopies ?? book.stock ?? 1;
  document.getElementById('fIsbn').value = book.isbn || '';
  // API field: publishYear
  document.getElementById('fPublishYear').value = book.publishYear || book.publishedYear || '';
  document.getElementById('fPublisher').value = book.publisher || '';
  document.getElementById('fPages').value = book.pages || '';
  document.getElementById('fLocation').value = book.location || '';
  document.getElementById('fDesc').value = book.description || '';
  // API field: coverImage
  document.getElementById('fCoverImage').value = book.coverImage || book.cover || '';
  document.getElementById('bookModal').classList.add('open');
}

function closeBookModal() {
  document.getElementById('bookModal').classList.remove('open');
}

document.getElementById('modalClose').onclick = closeBookModal;
document.getElementById('modalCancel').onclick = closeBookModal;
document.getElementById('btnAddBook').onclick = openAdd;

// SIMPAN BUKU
document.getElementById('modalSave').onclick = async () => {
  const title = document.getElementById('fTitle').value.trim();
  const author = document.getElementById('fAuthor').value.trim();
  
  if (!title || !author) {
    App.showToast('Judul dan penulis wajib diisi!', 'error');
    return;
  }
  
  // Kirim sesuai field API
  const payload = {
    title,
    author,
    category: document.getElementById('fCategory').value || 'lainnya',
    totalCopies: parseInt(document.getElementById('fTotalCopies').value) || 1,
    isbn: document.getElementById('fIsbn').value.trim(),
    publishYear: parseInt(document.getElementById('fPublishYear').value) || null,
    publisher: document.getElementById('fPublisher').value.trim(),
    pages: parseInt(document.getElementById('fPages').value) || null,
    location: document.getElementById('fLocation').value.trim(),
    description: document.getElementById('fDesc').value.trim(),
    coverImage: document.getElementById('fCoverImage').value.trim()
  };
  
  const btn = document.getElementById('modalSave');
  btn.disabled = true;
  btn.textContent = 'Menyimpan...';
  
  try {
    if (editingId) {
      await BookService.update(editingId, payload);
      App.showToast('Buku berhasil diupdate!', 'success');
    } else {
      await BookService.create(payload);
      App.showToast('Buku berhasil ditambahkan!', 'success');
    }
    closeBookModal();
    await loadBooks();
  } catch (err) {
    App.showToast(err.message || 'Gagal menyimpan buku', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Simpan';
  }
};

// ==================== MODAL HAPUS ====================
function openDelete(id, title) {
  deletingId = id;
  document.getElementById('deleteBookName').textContent = title;
  document.getElementById('deleteModal').classList.add('open');
}

function closeDeleteModal() {
  document.getElementById('deleteModal').classList.remove('open');
}

document.getElementById('deleteClose').onclick = closeDeleteModal;
document.getElementById('deleteCancelBtn').onclick = closeDeleteModal;

document.getElementById('deleteConfirmBtn').onclick = async () => {
  const btn = document.getElementById('deleteConfirmBtn');
  btn.disabled = true;
  btn.textContent = 'Menghapus...';
  
  try {
    await BookService.delete(deletingId);
    App.showToast('Buku berhasil dihapus!', 'success');
    closeDeleteModal();
    await loadBooks();
  } catch (err) {
    App.showToast(err.message || 'Gagal menghapus buku', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Hapus';
  }
};

// ==================== MODAL PINJAM ====================
function openBorrow(id, title, author) {
  borrowingId = id;
  document.getElementById('borrowBookTitle').textContent = title;
  document.getElementById('borrowBookAuthor').textContent = author;
  document.getElementById('borrowNotes').value = '';
  document.getElementById('borrowModal').classList.add('open');
}

function closeBorrowModal() {
  document.getElementById('borrowModal').classList.remove('open');
}

document.getElementById('borrowClose').onclick = closeBorrowModal;
document.getElementById('borrowCancelBtn').onclick = closeBorrowModal;

document.getElementById('borrowConfirmBtn').onclick = async () => {
  const btn = document.getElementById('borrowConfirmBtn');
  const notes = document.getElementById('borrowNotes').value.trim();
  btn.disabled = true;
  btn.textContent = 'Memproses...';
  
  try {
    // API: POST /api/loans/borrow { bookId, notes }
    await LoanService.borrow(borrowingId, null, notes);
    App.showToast('Buku berhasil dipinjam! Jatuh tempo 14 hari.', 'success');
    closeBorrowModal();
    await loadBooks();
  } catch (err) {
    App.showToast(err.message || 'Gagal meminjam buku', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Pinjam Sekarang';
  }
};

// ==================== EXPOSE GLOBAL ====================
window.openEdit = openEdit;
window.openDelete = openDelete;
window.openBorrow = openBorrow;

// ==================== START ====================
loadBooks();
</script>
</body>
</html>
