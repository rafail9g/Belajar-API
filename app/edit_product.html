<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peminjaman — LibraryKuy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="index.html" class="nav-brand">
    <div class="nav-brand-icon">L</div>
    <span class="nav-brand-text">Library<span>Kuy</span></span>
  </a>
  <div class="nav-links" id="navLinks"></div>
  <div class="nav-user">
    <div class="nav-user-info">
      <div class="nav-user-name" id="navName">—</div>
      <div class="nav-user-role" id="navRole">—</div>
    </div>
    <div class="nav-avatar" id="navAvatar">?</div>
    <button class="btn btn-outline btn-sm" id="btnLogout">Keluar</button>
  </div>
</nav>

<div class="page-wrapper">
  <div class="page-header">
    <div>
      <div class="page-label">Manajemen</div>
      <h1 class="page-title" id="pageTitle">Peminjaman Saya</h1>
      <p class="page-subtitle" id="pageSubtitle">Riwayat dan status peminjaman buku Anda</p>
    </div>
    
  </div>

  <!-- FINE SUMMARY -->
  <div id="fineSummary" style="display:none;"></div>

  <!-- FILTER -->
  <div class="search-bar" style="margin-bottom:16px;">
    <select id="filterStatus" class="form-control" style="max-width:180px;">
      <option value="">Semua Status</option>
      <option value="borrowed">Dipinjam</option>
      <option value="overdue">Terlambat</option>
      <option value="returned">Dikembalikan</option>
      <option value="lost">Hilang</option>
    </select>
    <div class="search-input-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchLoan" class="form-control" placeholder="Cari judul buku..." />
    </div>
  </div>

  <!-- TABLE -->
  <div class="card" style="padding:0;">
    <div id="loansContainer">
      <div class="loading"><div class="spinner"></div>Memuat data...</div>
    </div>
  </div>
</div>

<!-- MOBILE NAV -->
<nav class="mobile-nav" id="mobileNav"></nav>

<!-- MODAL DETAIL -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Detail Peminjaman</span>
      <button class="modal-close" id="detailClose">✕</button>
    </div>
    <div id="detailContent"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="detailCloseBtn">Tutup</button>
      <button class="btn btn-success" id="detailReturnBtn" style="display:none;">Kembalikan Buku</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="../services/app.js"></script>
<script src="../services/authService.js"></script>
<script src="../services/productServices.js"></script>
<script>
if (!App.isLoggedIn()) App.redirect('login.html');

const user = App.getUser();
const isAdmin = App.isAdmin();

document.getElementById('navName').textContent = user?.name || 'User';
document.getElementById('navRole').textContent = isAdmin ? 'Administrator' : 'Member';
document.getElementById('navAvatar').textContent = (user?.name || 'U')[0].toUpperCase();

const navLinks = document.getElementById('navLinks');
const mobileNav = document.getElementById('mobileNav');
const links = [
  { href: 'index.html', label: 'Dashboard', icon: '⊟' },
  { href: 'add.product.html', label: 'Katalog Buku', icon: '📚' },
  { href: 'edit_product.html', label: 'Peminjaman', icon: '🔄', active: true },
];
navLinks.innerHTML = links.map(l =>
  `<a href="${l.href}" class="nav-link ${l.active ? 'active' : ''}">${l.label}</a>`
).join('');
mobileNav.innerHTML = `<div class="mobile-nav-links">${links.map(l =>
  `<a href="${l.href}" class="mobile-nav-link ${l.active ? 'active' : ''}">${l.icon}<span>${l.label}</span></a>`
).join('')}</div>`;

document.getElementById('btnLogout').addEventListener('click', () => {
  App.clearAuth(); App.redirect('login.html');
});

// Admin: tampil riwayat semua peminjaman. User: peminjaman sendiri.
if (isAdmin) {
  document.getElementById('pageTitle').textContent = 'Riwayat Peminjaman';
  document.getElementById('pageSubtitle').textContent = 'Seluruh riwayat peminjaman anggota perpustakaan';
}

let allLoans = [];
let returningId = null;

// ==================== HELPERS STATUS API ====================
// API status: borrowed | returned | overdue | lost
function getLoanStatus(loan) {
  // Gunakan status dari API langsung
  if (loan.status) return loan.status;
  // Fallback: hitung manual
  if (loan.returnDate) return 'returned';
  const due = new Date(loan.dueDate);
  return due < new Date() ? 'overdue' : 'borrowed';
}

function getFineAmount(loan) {
  // API field: fineAmount
  return loan.fineAmount || loan.fine || 0;
}

function getLoanTitle(loan) {
  // API: loan.book bisa berupa string (ID) atau object
  return loan.book?.title || loan.bookTitle || '-';
}

function getLoanAuthor(loan) {
  return loan.book?.author || loan.bookAuthor || '';
}

function getMemberName(loan) {
  return loan.member?.name || loan.memberName || loan.user?.name || '-';
}

// API field: loanDate (bukan borrowDate)
function getLoanDate(loan) {
  return loan.loanDate || loan.borrowDate || loan.loan_date;
}

// ==================== LOAD DATA ====================
async function loadLoans() {
  document.getElementById('loansContainer').innerHTML =
    '<div class="loading"><div class="spinner"></div>Memuat data...</div>';
  try {
    let result;
    if (isAdmin) {
      // Admin: ambil semua peminjaman dari seluruh anggota
      result = await LoanService.getAll();
    } else {
      // User: hanya peminjaman milik sendiri
      result = await LoanService.getMyLoans();
    }

    allLoans = result.data || result.loans || result || [];
    renderFines();
    renderLoans(allLoans);
  } catch (err) {
    document.getElementById('loansContainer').innerHTML =
      `<div style="padding:24px;"><div class="alert alert-error">${err.message}</div></div>`;
  }
}

function renderFines() {
  // Hanya tampilkan warning denda untuk user biasa (bukan admin)
  if (isAdmin) {
    document.getElementById('fineSummary').style.display = 'none';
    return;
  }
  const overdueLoans = allLoans.filter(l => getLoanStatus(l) === 'overdue');
  const totalFine = overdueLoans.reduce((sum, l) => {
    const fine = l.fineAmount || (l.lateDays ? l.lateDays * 1000 : 0);
    return sum + fine;
  }, 0);

  if (overdueLoans.length > 0) {
    document.getElementById('fineSummary').style.display = 'block';
    document.getElementById('fineSummary').innerHTML = `
      <div style="background:var(--danger-dim); border:1px solid rgba(200,75,75,0.25); border-radius:var(--radius2); padding:20px 24px; margin-bottom:24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;">
        <div>
          <div style="font-size:11px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--danger); margin-bottom:6px;">⚠ Peringatan Denda</div>
          <div style="font-family:'Barlow Condensed',sans-serif; font-size:28px; font-weight:800; color:var(--danger);">Rp ${totalFine.toLocaleString('id-ID')}</div>
          <div style="font-size:13px; color:var(--text2); margin-top:4px;">Dari ${overdueLoans.length} buku yang terlambat dikembalikan</div>
        </div>
        <div style="font-size:13px; color:var(--text2);">Denda: Rp 1.000/hari keterlambatan</div>
      </div>`;
  } else {
    document.getElementById('fineSummary').style.display = 'none';
  }
}

function renderLoans(loans) {
  const statusFilter = document.getElementById('filterStatus').value;
  const searchQ = document.getElementById('searchLoan').value.toLowerCase();

  const filtered = loans.filter(l => {
    const status = getLoanStatus(l);
    const title = getLoanTitle(l).toLowerCase();
    const matchStatus = !statusFilter || status === statusFilter;
    const matchSearch = !searchQ || title.includes(searchQ);
    return matchStatus && matchSearch;
  });

  if (filtered.length === 0) {
    document.getElementById('loansContainer').innerHTML = `
      <div class="empty">
        <div class="empty-icon">🔄</div>
        <div class="empty-title">Tidak Ada Data</div>
        <div class="empty-text">Belum ada peminjaman yang sesuai filter</div>
      </div>`;
    return;
  }

  const statusBadge = {
    returned: '<span class="badge badge-green">Dikembalikan</span>',
    overdue: '<span class="badge badge-red">Terlambat</span>',
    borrowed: '<span class="badge badge-blue">Dipinjam</span>',
    lost: '<span class="badge badge-gray">Hilang</span>'
  };

  document.getElementById('loansContainer').innerHTML = `
    <div class="table-wrap" style="border:none; border-radius:0;">
      <table>
        <thead>
          <tr>
            <th>Buku</th>
            ${isAdmin ? '<th>Peminjam</th>' : ''}
            <th>Tgl Pinjam</th>
            <th>Jatuh Tempo</th>
            <th>Tgl Kembali</th>
            <th>Status</th>
            <th>Denda</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.map(l => {
            const status = getLoanStatus(l);
            const fine = l.fineAmount || (l.lateDays ? l.lateDays * 1000 : 0);
            const loanId = l._id || l.id;
            // API fields: loanDate, dueDate, returnDate
            const loanDate = getLoanDate(l);
            return `<tr>
              <td>
                <strong>${getLoanTitle(l)}</strong><br>
                <small style="color:var(--text3)">${getLoanAuthor(l)}</small>
                ${l.loanCode ? `<br><small style="color:var(--text3);">${l.loanCode}</small>` : ''}
              </td>
              ${isAdmin ? `<td>${getMemberName(l)}</td>` : ''}
              <td>${loanDate ? new Date(loanDate).toLocaleDateString('id-ID') : '-'}</td>
              <td style="${status === 'overdue' ? 'color:var(--danger)' : ''}">${l.dueDate ? new Date(l.dueDate).toLocaleDateString('id-ID') : '-'}</td>
              <td>${l.returnDate ? new Date(l.returnDate).toLocaleDateString('id-ID') : '-'}</td>
              <td>${statusBadge[status] || statusBadge['borrowed']}</td>
              <td>${fine > 0 ? `<span style="color:var(--danger); font-weight:600">Rp ${fine.toLocaleString('id-ID')}</span>` : '-'}</td>
              <td>
                <div class="actions-cell">
                  <button class="btn btn-outline btn-sm" onclick="openDetail('${loanId}')">Detail</button>
                  ${status === 'borrowed' || status === 'overdue' 
                    ? `<button class="btn btn-success btn-sm" onclick="quickReturn('${loanId}')">Kembalikan</button>` 
                    : ''}
                </div>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}

document.getElementById('filterStatus').addEventListener('change', () => renderLoans(allLoans));
document.getElementById('searchLoan').addEventListener('input', () => renderLoans(allLoans));

// ==================== DETAIL MODAL ====================
async function openDetail(id) {
  document.getElementById('detailContent').innerHTML =
    '<div class="loading"><div class="spinner"></div>Memuat...</div>';
  document.getElementById('detailReturnBtn').style.display = 'none';
  document.getElementById('detailModal').classList.add('open');

  try {
    const loan = allLoans.find(l => (l._id || l.id) === id);
    if (!loan) throw new Error('Data tidak ditemukan');

    const status = getLoanStatus(loan);
    const fine = loan.fineAmount || (loan.lateDays ? loan.lateDays * 1000 : 0);
    returningId = id;

    if (status === 'borrowed' || status === 'overdue') {
      document.getElementById('detailReturnBtn').style.display = 'inline-flex';
    }

    const statusLabel = { borrowed: 'Dipinjam', overdue: 'Terlambat', returned: 'Dikembalikan', lost: 'Hilang' }[status] || status;
    const statusColor = { borrowed: 'var(--info)', overdue: 'var(--danger)', returned: 'var(--success)', lost: 'var(--text3)' }[status];
    const loanDate = getLoanDate(loan);

    document.getElementById('detailContent').innerHTML = `
      <div style="margin-bottom:20px; padding:16px; background:var(--bg3); border-radius:var(--radius); border:1px solid var(--border);">
        <div style="font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:700; color:var(--text);">${getLoanTitle(loan)}</div>
        <div style="font-size:13px; color:var(--text2);">${getLoanAuthor(loan)}</div>
        ${loan.loanCode ? `<div style="font-size:11px; color:var(--text3); margin-top:4px; letter-spacing:0.08em;">${loan.loanCode}</div>` : ''}
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; font-size:14px;">
        <div>
          <div style="color:var(--text3); font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:4px;">Peminjam</div>
          <div style="color:var(--text);">${getMemberName(loan)}</div>
        </div>
        <div>
          <div style="color:var(--text3); font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:4px;">Status</div>
          <div style="color:${statusColor}; font-weight:600;">${statusLabel}</div>
        </div>
        <div>
          <div style="color:var(--text3); font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:4px;">Tanggal Pinjam</div>
          <div style="color:var(--text);">${loanDate ? new Date(loanDate).toLocaleDateString('id-ID', {day:'numeric',month:'long',year:'numeric'}) : '-'}</div>
        </div>
        <div>
          <div style="color:var(--text3); font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:4px;">Jatuh Tempo</div>
          <div style="color:${status === 'overdue' ? 'var(--danger)' : 'var(--text)'};">${loan.dueDate ? new Date(loan.dueDate).toLocaleDateString('id-ID', {day:'numeric',month:'long',year:'numeric'}) : '-'}</div>
        </div>
        ${loan.lateDays > 0 ? `
        <div>
          <div style="color:var(--text3); font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:4px;">Keterlambatan</div>
          <div style="color:var(--danger);">${loan.lateDays} hari</div>
        </div>` : ''}
        ${loan.returnDate ? `
        <div>
          <div style="color:var(--text3); font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:4px;">Tanggal Kembali</div>
          <div style="color:var(--text);">${new Date(loan.returnDate).toLocaleDateString('id-ID', {day:'numeric',month:'long',year:'numeric'})}</div>
        </div>` : ''}
        ${fine > 0 ? `
        <div style="grid-column:1/-1; background:var(--danger-dim); border:1px solid rgba(200,75,75,0.2); border-radius:var(--radius); padding:14px; margin-top:4px;">
          <div style="color:var(--text3); font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:4px;">Total Denda</div>
          <div style="font-family:'Barlow Condensed',sans-serif; font-size:28px; font-weight:800; color:var(--danger);">Rp ${fine.toLocaleString('id-ID')}</div>
          <div style="font-size:12px; color:var(--text3); margin-top:4px;">
            ${loan.finePaid ? '✅ Sudah dibayar' : 'Belum dibayar — Rp 1.000 per hari keterlambatan'}
          </div>
        </div>` : ''}
        ${loan.notes ? `
        <div style="grid-column:1/-1;">
          <div style="color:var(--text3); font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:4px;">Catatan</div>
          <div style="color:var(--text2);">${loan.notes}</div>
        </div>` : ''}
      </div>`;
  } catch (err) {
    document.getElementById('detailContent').innerHTML =
      `<div class="alert alert-error">${err.message}</div>`;
  }
}

function closeDetail() { document.getElementById('detailModal').classList.remove('open'); }
document.getElementById('detailClose').addEventListener('click', closeDetail);
document.getElementById('detailCloseBtn').addEventListener('click', closeDetail);

document.getElementById('detailReturnBtn').addEventListener('click', () => quickReturn(returningId, true));

async function quickReturn(loanId, fromModal = false) {
  if (!confirm('Konfirmasi pengembalian buku?')) return;
  try {
    // API: PUT /api/loans/{id}/return
    await LoanService.returnBook(loanId);
    App.showToast('Buku berhasil dikembalikan!', 'success');
    if (fromModal) closeDetail();
    loadLoans();
  } catch (err) {
    App.showToast(err.message, 'error');
  }
}

window.openDetail = openDetail;
window.quickReturn = quickReturn;

loadLoans();
</script>
</body>
</html>
