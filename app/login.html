<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — LibraryKuy</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: var(--bg);
      background-image: none;
    }
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      padding: 0;
      position: relative;
    }
    /* Left panel: background image */
    .auth-bg-panel {
      flex: 1;
      background: url('https://cdn-media.sforum.vn/storage/app/media/ctv_seo3/mau-background-dep-2.jpg') center center / cover no-repeat;
      position: relative;
      display: flex;
      align-items: flex-end;
      padding: 48px;
      min-height: 100vh;
    }
    .auth-bg-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(10,12,15,0.55) 0%, rgba(10,12,15,0.2) 60%, rgba(200,168,75,0.15) 100%);
    }
    .auth-bg-text {
      position: relative;
      z-index: 1;
    }
    .auth-bg-text h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 48px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.05;
      text-shadow: 0 2px 24px rgba(0,0,0,0.5);
    }
    .auth-bg-text h2 span { color: var(--accent); }
    .auth-bg-text p {
      font-size: 15px;
      color: rgba(255,255,255,0.75);
      margin-top: 10px;
      font-weight: 400;
      max-width: 320px;
    }
    /* Right panel: form */
    .auth-form-panel {
      width: 420px;
      flex-shrink: 0;
      background: var(--bg2);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 40px;
      min-height: 100vh;
    }
    .auth-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
      align-self: flex-start;
    }
    .auth-logo-icon {
      width: 44px;
      height: 44px;
      background: var(--accent);
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 22px;
      clip-path: polygon(0 0, 85% 0, 100% 15%, 100% 100%, 15% 100%, 0 85%);
    }
    .auth-logo-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text);
    }
    .auth-logo-text span { color: var(--accent); }
    .auth-form-inner {
      width: 100%;
    }
    .auth-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 4px;
    }
    .auth-sub {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 32px;
    }
    .auth-footer {
      margin-top: 40px;
      font-size: 11px;
      color: var(--text3);
      letter-spacing: 0.06em;
      text-align: center;
    }
    @media (max-width: 768px) {
      .auth-bg-panel { display: none; }
      .auth-form-panel { width: 100%; padding: 32px 24px; }
    }
  </style>
</head>
<body>
<div class="auth-container">
  <!-- BG PANEL -->
  <div class="auth-bg-panel">
    <div class="auth-bg-text">
      <h2>Perpustakaan<br><span>Digital</span><br>LibraryKuy</h2>
      <p>Temukan ribuan koleksi buku dan kelola peminjaman dengan mudah.</p>
    </div>
  </div>

  <!-- FORM PANEL -->
  <div class="auth-form-panel">
    <div class="auth-logo">
      <div class="auth-logo-icon">L</div>
      <div class="auth-logo-text">Library<span>Kuy</span></div>
    </div>

    <div class="auth-form-inner">
      <h1 class="auth-title">Masuk</h1>
      <p class="auth-sub">Masukkan kredensial Anda untuk melanjutkan</p>

      <div id="alert" style="display:none" class="alert alert-error"></div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="nama@email.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button id="btnLogin" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:6px;">
        Masuk
      </button>

      <div class="auth-divider">atau</div>
      <p class="auth-link">Belum punya akun? <a href="register.html">Daftar sekarang</a></p>
    </div>

    <div class="auth-footer">© 2026 LibraryKuy — SISTEM PERPUSTAKAAN</div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="../services/app.js"></script>
<script src="../services/authService.js"></script>
<script>
  if (App.isLoggedIn()) {
    App.redirect('index.html');
  }

  document.getElementById('btnLogin').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const alertEl = document.getElementById('alert');
    const btn = document.getElementById('btnLogin');

    alertEl.style.display = 'none';

    if (!email || !password) {
      alertEl.textContent = 'Email dan password wajib diisi.';
      alertEl.style.display = 'flex';
      return;
    }

    btn.textContent = 'Memproses...';
    btn.disabled = true;

    try {
      const response = await AuthService.login(email, password);
      const accessToken = response.data?.accessToken;
      const refreshToken = response.data?.refreshToken;
      const user = response.data?.user;
      if (!accessToken) throw new Error('Token tidak ditemukan dalam response server');
      App.setAuth(accessToken, user, refreshToken);
      App.redirect('index.html');
    } catch (err) {
      alertEl.textContent = err.message;
      alertEl.style.display = 'flex';
      btn.textContent = 'Masuk';
      btn.disabled = false;
    }
  });

  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('btnLogin').click();
  });
</script>
</body>
</html>
