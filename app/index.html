<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — LibraryKuy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="index.html" class="nav-brand">
    <div class="nav-brand-icon">L</div>
    <span class="nav-brand-text">Library<span>Kuy</span></span>
  </a>
  <div class="nav-links" id="navLinks"></div>
  <div class="nav-user">
    <div class="nav-user-info">
      <div class="nav-user-name" id="navName">—</div>
      <div class="nav-user-role" id="navRole">—</div>
    </div>
    <div class="nav-avatar" id="navAvatar">?</div>
    <button class="btn btn-outline btn-sm" id="btnLogout">Keluar</button>
  </div>
</nav>

<div class="page-wrapper">
  <div class="page-header">
    <div>
      <div class="page-label">Dashboard</div>
      <h1 class="page-title">Selamat Datang, <span id="heroName">—</span></h1>
      <p class="page-subtitle">Ringkasan aktivitas perpustakaan Anda</p>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-grid" id="statsGrid">
    <div class="loading"><div class="spinner"></div>Memuat data...</div>
  </div>

  <!-- RECENT LOANS -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">
        <span class="accent-line"></span>
        Peminjaman Terbaru
      </span>
      <a href="edit_product.html" class="btn btn-outline btn-sm">Lihat Semua</a>
    </div>
    <div id="recentLoans">
      <div class="loading"><div class="spinner"></div>Memuat...</div>
    </div>
  </div>
</div>

<!-- MOBILE NAV -->
<nav class="mobile-nav" id="mobileNav"></nav>

<div id="toast" class="toast"></div>

<script src="../services/app.js"></script>
<script src="../services/authService.js"></script>
<script src="../services/productServices.js"></script>
<script>
if (!App.isLoggedIn()) App.redirect('login.html');

const user = App.getUser();
const isAdmin = App.isAdmin();

document.getElementById('navName').textContent = user?.name || 'User';
document.getElementById('navRole').textContent = isAdmin ? 'Administrator' : 'Member';
document.getElementById('navAvatar').textContent = (user?.name || 'U')[0].toUpperCase();
document.getElementById('heroName').textContent = (user?.name || 'User').split(' ')[0];

const navLinks = document.getElementById('navLinks');
const mobileNav = document.getElementById('mobileNav');

const links = [
  { href: 'index.html', label: 'Dashboard', icon: '⊟', active: true },
  { href: 'add.product.html', label: 'Katalog Buku', icon: '📚' },
  { href: 'edit_product.html', label: 'Peminjaman', icon: '🔄' },
];

navLinks.innerHTML = links.map(l =>
  `<a href="${l.href}" class="nav-link ${l.active ? 'active' : ''}">${l.label}</a>`
).join('');

mobileNav.innerHTML = `<div class="mobile-nav-links">${links.map(l =>
  `<a href="${l.href}" class="mobile-nav-link ${l.active ? 'active' : ''}">${l.icon}<span>${l.label}</span></a>`
).join('')}</div>`;

document.getElementById('btnLogout').addEventListener('click', () => {
  App.clearAuth();
  App.redirect('login.html');
});

// Helper: ambil status dari loan API
function getLoanStatus(loan) {
  if (loan.status) return loan.status;
  if (loan.returnDate) return 'returned';
  const due = new Date(loan.dueDate);
  return due < new Date() ? 'overdue' : 'borrowed';
}

function getLoanTitle(loan) {
  return loan.book?.title || loan.bookTitle || '-';
}

function getMemberName(loan) {
  return loan.member?.name || loan.memberName || loan.user?.name || '-';
}

// API field: loanDate
function getLoanDate(loan) {
  return loan.loanDate || loan.borrowDate;
}

async function loadDashboard() {
  try {
    let statsData = null;
    let loanList = [];

    if (isAdmin) {
      // Admin: gunakan endpoint dashboard untuk statistik
      const [dashResult, loansResult] = await Promise.all([
        MemberService.getDashboard(),
        LoanService.getAll()
      ]);
      // API dashboard: { totalBooks, totalMembers, totalLoans, activeLoans, overdueLoans, unpaidFineCount, unpaidFineAmount }
      statsData = dashResult;
      loanList = loansResult.data || [];
    } else {
      // Member: ambil data sendiri
      const [booksResult, loansResult] = await Promise.all([
        BookService.getAll(),
        LoanService.getMyLoans()
      ]);
      loanList = loansResult.data || [];
      const bookList = Array.isArray(booksResult) ? booksResult : (booksResult.books || []);

      // Hitung statistik manual untuk member
      const activeLoans = loanList.filter(l => getLoanStatus(l) === 'borrowed');
      const overdueLoans = loanList.filter(l => getLoanStatus(l) === 'overdue');
      const totalFine = loanList.reduce((s, l) => s + (l.fineAmount || 0), 0);

      statsData = {
        totalBooks: bookList.length,
        totalLoans: loanList.length,
        activeLoans: activeLoans.length,
        overdueLoans: overdueLoans.length,
        unpaidFineAmount: totalFine
      };
    }

    // Render stats
    if (isAdmin) {
      document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card">
          <div class="stat-label">Total Buku</div>
          <div class="stat-value">${statsData.totalBooks ?? '—'}</div>
          <div class="stat-sub">Di koleksi perpustakaan</div>
        </div>
        <div class="stat-card info">
          <div class="stat-label">Total Anggota</div>
          <div class="stat-value">${statsData.totalMembers ?? '—'}</div>
          <div class="stat-sub">Terdaftar</div>
        </div>
        <div class="stat-card success">
          <div class="stat-label">Sedang Dipinjam</div>
          <div class="stat-value">${statsData.activeLoans ?? '—'}</div>
          <div class="stat-sub">Belum dikembalikan</div>
        </div>
        <div class="stat-card danger">
          <div class="stat-label">Terlambat</div>
          <div class="stat-value">${statsData.overdueLoans ?? '—'}</div>
          <div class="stat-sub">Denda belum bayar: ${statsData.unpaidFineCount ?? 0} item · Rp ${(statsData.unpaidFineAmount ?? 0).toLocaleString('id-ID')}</div>
        </div>
      `;
    } else {
      document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card">
          <div class="stat-label">Total Buku</div>
          <div class="stat-value">${statsData.totalBooks ?? '—'}</div>
          <div class="stat-sub">Tersedia di katalog</div>
        </div>
        <div class="stat-card info">
          <div class="stat-label">Total Peminjaman</div>
          <div class="stat-value">${statsData.totalLoans ?? '—'}</div>
          <div class="stat-sub">Sepanjang waktu</div>
        </div>
        <div class="stat-card success">
          <div class="stat-label">Sedang Dipinjam</div>
          <div class="stat-value">${statsData.activeLoans ?? '—'}</div>
          <div class="stat-sub">Belum dikembalikan</div>
        </div>
        <div class="stat-card danger">
          <div class="stat-label">Terlambat</div>
          <div class="stat-value">${statsData.overdueLoans ?? '—'}</div>
          <div class="stat-sub">Total denda: Rp ${(statsData.unpaidFineAmount ?? 0).toLocaleString('id-ID')}</div>
        </div>
      `;
    }

    // Recent loans table
    const recent = loanList.slice(0, 6);
    if (recent.length === 0) {
      document.getElementById('recentLoans').innerHTML = `
        <div class="empty">
          <div class="empty-icon">📚</div>
          <div class="empty-title">Belum Ada Peminjaman</div>
          <div class="empty-text">Mulai pinjam buku dari katalog</div>
        </div>`;
      return;
    }

    const statusBadge = {
      returned: '<span class="badge badge-green">Dikembalikan</span>',
      overdue: '<span class="badge badge-red">Terlambat</span>',
      borrowed: '<span class="badge badge-blue">Dipinjam</span>',
      lost: '<span class="badge badge-gray">Hilang</span>'
    };

    document.getElementById('recentLoans').innerHTML = `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Buku</th>
              ${isAdmin ? '<th>Peminjam</th>' : ''}
              <th>Tgl Pinjam</th>
              <th>Jatuh Tempo</th>
              <th>Status</th>
              <th>Denda</th>
            </tr>
          </thead>
          <tbody>
            ${recent.map(l => {
              const status = getLoanStatus(l);
              const fine = l.fineAmount || 0;
              const loanDate = getLoanDate(l);
              return `<tr>
                <td>${getLoanTitle(l)}</td>
                ${isAdmin ? `<td>${getMemberName(l)}</td>` : ''}
                <td>${loanDate ? new Date(loanDate).toLocaleDateString('id-ID') : '-'}</td>
                <td>${l.dueDate ? new Date(l.dueDate).toLocaleDateString('id-ID') : '-'}</td>
                <td>${statusBadge[status] || statusBadge['borrowed']}</td>
                <td>${fine > 0 ? `<span style="color:var(--danger)">Rp ${fine.toLocaleString('id-ID')}</span>` : '-'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
  } catch (err) {
    document.getElementById('statsGrid').innerHTML = `<div class="alert alert-error">${err.message}</div>`;
  }
}

loadDashboard();
</script>
</body>
</html>
